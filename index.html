<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="X-GEO — Monte Carlo citation probability intervals for AI search. Measure how ChatGPT, Google AI Overviews and Perplexity cite your brand, with confidence bounds." />
    <meta name="theme-color" content="#0A0A0B" />
    <meta property="og:title" content="X-GEO — Measure AI Citations with Confidence" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230A0A0B'/%3E%3Cpath d='M6.5 6.5l11 11M17.5 6.5l-11 11' stroke='%238B5CF6' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='12' r='1.6' fill='%23FAFAFA'/%3E%3C/svg%3E"
    />
    <title>X-GEO — Measure AI Citations with Confidence</title>
    <script>
      // Theme bootstrap: dark is the default. Runs before first paint to avoid FOUC.
      (function () {
        try {
          var stored = localStorage.getItem('xgeo-theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Inter:opsz,wght@14..32,300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
