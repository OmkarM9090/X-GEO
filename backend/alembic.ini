# =============================================================================
# X-GEO backend — Alembic configuration
# =============================================================================
# The database URL is intentionally NOT defined here: migrations/env.py reads it
# from app.config.Settings (DATABASE_URL) so there is exactly one source of
# truth for credentials. `alembic -x db_url=...` can override it at runtime.
# =============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# Set to true to enable the `alembic check` command in CI
# (fails when models and migrations drift apart).
revision_environment = false

[post_write_hooks]
# Keep generated migrations formatted like the rest of the codebase.
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
