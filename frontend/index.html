<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="X-GEO measures AI search visibility with Monte Carlo citation probability intervals, source-level factuality checks, and clear confidence bounds." />
    <meta name="theme-color" content="#0A0A0B" />
    <meta property="og:title" content="X-GEO — Measure AI Citations with Confidence" />
    <meta property="og:description" content="Replace single-snapshot AI visibility checks with statistically grounded Citation Probability Intervals." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/GeistVF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMonoVF.woff2" as="font" type="font/woff2" crossorigin />
    <title>X-GEO — Measure AI Citations with Confidence</title>
    <script>
      // Apply the persisted color mode before React to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('xgeo-theme');
          if (stored === 'light') document.documentElement.classList.remove('dark');
          else document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
